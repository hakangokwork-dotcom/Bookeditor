name: Site (inkguide.uk)

on:
  push:
    branches: [main]
    paths:
      - 'public/site/**'
      # Tarayıcı sürümü (inkguide.uk/app) masaüstü arayüzünden üretilir
      - 'public/*.js'
      - 'public/index.html'
      - 'public/style.css'
      - 'public/guide/**'
      - 'lib/export.js'
      - 'data/book.sample.json'
      - 'tools/build-webapp.mjs'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Site dosyalarını hazırla
        run: |
          cp -r public/site _site
          echo "inkguide.uk" > _site/CNAME
          node tools/build-webapp.mjs _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
