  - main [ref=f1e149]:
    - generic [ref=f1e150]:
      - generic [ref=f1e151]: İlk kitabını yazanlar için
      - heading "Rehber" [level=1] [ref=f1e152]
      - paragraph [ref=f1e153]: Bu araç, notlarınızı bölümlere dönüştürüp kitabınıza doğru yürümeniz için tasarlandı. Soldan bir bölüm seçin, notlarınızı (NotebookLM çıktıları, sentezler, alıntılar) o bölüme ekleyin; hazır olduğunuzda taslağı yazın.
      - heading "Önerilen çalışma akışı" [level=2] [ref=f1e154]
      - generic [ref=f1e155]:
        - generic [ref=f1e156]:
          - generic [ref=f1e157]: "1"
          - paragraph [ref=f1e158]: Topla. NotebookLM'den ve okumalarınızdan çıkan her şeyi ilgili bölüme not olarak ekleyin. Düşünmeyin, biriktirin.
        - generic [ref=f1e159]:
          - generic [ref=f1e160]: "2"
          - paragraph [ref=f1e161]: Sentezle. Notlar birikince "bu bölümün ana fikri ne?" sorusuna cevap veren sentez notları yazın. Şema, diyagram ve illüstrasyon fikirlerinizi görsel notu olarak kaydedin — kitap tasarımı aşamasında hazır bir görsel listeniz olur.
        - generic [ref=f1e162]:
          - generic [ref=f1e163]: "3"
          - paragraph [ref=f1e164]: Yaz. Sentezlere bakarak taslağı yazın. Notlar sağ elinizin altında, taslak önünüzde. Dışarıdan metin getirirken Yapıştır satır kırıklarını ve kalıntıları temizler; Düzelt aynı temizliği seçili metne uygular. B / I / H / Liste / ❝ düğmeleri seçili metni biçimlendirir.
        - generic [ref=f1e165]:
          - generic [ref=f1e166]: "4"
          - paragraph [ref=f1e167]: Dinlendir ve düzelt. Bölümü "bitti" işaretlemeden önce en az bir hafta bekletin, sonra yabancı gözüyle okuyun.
      - generic [ref=f1e168]: Kararsız mısınız? Nereye ait olduğunu bilmediğiniz her şeyi Karalama Defteri'ne atın; hazır olunca notu "bölüme taşı" ile yerine gönderin.
      - generic [ref=f1e169]: "🎤 Sesli not: Not alanlarının ve taslak araç çubuğunun yanındaki mikrofon düğmesine tıklayıp konuşun — söyledikleriniz yazıya dökülür; tekrar tıklayınca durur. (Konuşma tanıma tarayıcının servisiyle çalışır; Chrome/Edge gerekir ve ilk kullanımda mikrofon izni ister.)"
      - heading "Sık karışan yazım kuralları (TDK)" [level=2] [ref=f1e170]
      - generic [ref=f1e171]: "de / da: Bağlaç ise ayrı (\"ben de geldim\"), bulunma eki ise bitişik (\"evde\"). Test: çıkarınca cümle bozuluyorsa bitişiktir."
      - generic [ref=f1e172]: "ki: Bağlaç ise ayrı (\"öyle ki\"), aitlik eki ise bitişik (\"seninki\", \"akşamki\"). İstisna kalıplar: \"sanki, oysaki, çünkü, hâlbuki, mademki, meğerki, belki\"."
      - generic [ref=f1e173]: "Soru eki mı/mi: Her zaman ayrı yazılır: \"geldi mi?\", \"problem mi?\""
      - generic [ref=f1e174]: "Birleşik fiiller: \"hissetmek, kaybetmek, reddetmek\" bitişik; \"fark etmek, terk etmek, söz etmek\" ayrı."
      - generic [ref=f1e175]: "Sayılar: Metinde küçük sayılar yazıyla (\"üç yöntem\"), ölçüm ve istatistikler rakamla (\"%69\", \"55 dakika\")."
      - generic [ref=f1e176]: "Noktalama: Virgülle bağlanan uzun cümleler yerine kısa cümleler kurun. Üç nokta üçtür, beş değil…"
      - heading "Alıntı ve kaynak etiği" [level=2] [ref=f1e177]
      - list [ref=f1e178]:
        - listitem [ref=f1e179]: Birebir alıntı → tırnak içinde + kaynak + sayfa numarası. Kitapta 40 kelimeyi geçen alıntılar blok alıntı olur.
        - listitem [ref=f1e180]: Fikir aktarımı (kendi cümlelerinizle) da kaynak ister — intihalin en yaygın türü "parafraz edip kaynak vermemektir".
        - listitem [ref=f1e181]:
          - text: Taslak içinde
          - code [ref=f1e182]: "[[kaynak:kahneman2011]]"
          - text: yazın; kitaba dönüştürünce otomatik olarak (Kahneman, 2011) olur ve Kaynakça'ya girer.
        - listitem [ref=f1e183]: "İkincil alıntıdan kaçının: \"Kahneman'ın aktardığına göre Simon...\" yerine mümkünse asıl kaynağa gidin."
        - listitem [ref=f1e184]: "Söylenmiş sözleri doğrulayın: Einstein'a atfedilen sözlerin çoğu Einstein'a ait değildir. (Kitabınız için harika bir yan hikâye!)"
      - heading "Kitabın yapısı" [level=2] [ref=f1e185]
      - generic [ref=f1e186]:
        - generic [ref=f1e187]:
          - generic [ref=f1e188]: Önsöz
          - generic [ref=f1e189]: "Kitabın hikâyesi: neden ve kime yazdınız. Genelde en son yazılır."
        - generic [ref=f1e190]:
          - generic [ref=f1e191]: Giriş
          - generic [ref=f1e192]: Vaat ve okuma haritası. Okuyucu iki sayfada "bu kitap bana ne verecek?" cevabını almalı.
        - generic [ref=f1e193]:
          - generic [ref=f1e194]: Bölümler
          - generic [ref=f1e195]: Her bölüm tek bir soruya cevap versin; o soruyu sinopsis alanına yazın.
        - generic [ref=f1e196]:
          - generic [ref=f1e197]: Kaynakça
          - generic [ref=f1e198]: Otomatik oluşur; siz kaynakları girip atıf işaretçilerini kullanın.
      - heading "Kitaba dönüştürünce ne olur?" [level=2] [ref=f1e199]
      - paragraph [ref=f1e200]: "Sol alttaki \"Kitaba Dönüştür\" düğmesi kitabınızı üç formatta üretir: Markdown (ham metin), HTML (okumalık/baskı önizleme) ve Word (.docx) — kapak, içindekiler, önsöz, giriş, bölümler ve APA formatında kaynakça ile. Word dosyasını açınca içindekileri güncellemeyi onaylayın (alanlar otomatik dolar). Dosya adları tarih + saat damgalıdır; her dönüştürme ayrı bir çıktı versiyonudur."
      - heading "Versiyonlama ve güvenlik yedeği" [level=2] [ref=f1e201]
      - paragraph [ref=f1e202]:
        - text: "\"Versiyon\" düğmesi kitabın o anki halinin anlık görüntüsünü"
        - code [ref=f1e203]: versions/
        - text: klasörüne kaydeder. Büyük bir değişiklikten (bölüm silme, yeniden yapılandırma) önce bir versiyon alın; listeden tek tıkla geri yükleyebilirsiniz — geri yükleme öncesi mevcut hal de otomatik versiyonlanır, hiçbir şey kaybolmaz.
      - paragraph [ref=f1e204]:
        - text: "Emekler asla boşa gitmez: her kayıtta kitabınızın son hali"
        - code [ref=f1e205]: yedek/kitap-son-hali.md
        - text: ve
        - code [ref=f1e206]: yedek/kitap-son-hali.docx
        - text: dosyalarına da yazılır — notlarınız ve karalama defteriniz dahil. Bu uygulama bir gün hiç açılmasa bile, o Word dosyasını açıp kaldığınız yerden devam edebilirsiniz.
      - generic [ref=f1e207]:
        - button "Yazmaya dön" [ref=f1e208] [cursor=pointer]
        - button "Kaynakları düzenle" [ref=f1e209] [cursor=pointer]
