        - generic [ref=e427]: Taslakta [[kaynak:id]] yazın; kitapta (Yazar, Yıl) olur.
      - 'textbox "Taslağınızı buraya yazın. Markdown kullanabilirsiniz: **kalın**, *italik*, > alıntı bloğu. Atıf için: [[kaynak:id]]" [ref=e428]': "### Problem Nedir? Bir fabrikanın teslimat performansı yüzde 80’e düşüyor. Bir sabah arabamızın çalışmadığını görüyoruz. Bir çift sürekli aynı konuda tartışıyor. Bir çocuk matematik sorusunun başında ne yapacağını bilemiyor. Bir doktor hastasının ateşinin nedenini anlamaya çalışırken, bir bilim insanı deney sonucunun elindeki teoriyle neden uyuşmadığını araştırıyor. İlk bakışta birbirinden oldukça farklı görünen bütün bu durumları anlatırken aynı kelimeyi kullanıyoruz: problem. Peki gerçekten aynı şeyden mi söz ediyoruz? Bir makinenin çalışmamasıyla bir insanın “Eşim beni dinlemiyor” demesi aynı türden bir problem midir? Bir fabrikanın hedeflediği teslimat oranına ulaşamamasıyla, bir bilim insanının teorisinin açıklayamadığı bir deney sonucuyla karşılaşması arasında nasıl bir ortaklık vardır? Günlük hayatta oldukça rahat kullandığımız “problem” kelimesinin içine biraz yakından baktığımızda, aslında düşündüğümüzden çok daha geniş bir kavramla karşılaşırız. ### Önümüze Konulan Şey “Problem” kelimesinin kökünde Yunanca pro-ballein vardır. Pro “öne”, ballein ise “atmak” ya da “koymak” anlamına gelir. Buradan türeyen problēma, en genel anlamıyla insanın önüne konulan veya öne sürülen bir şeyi ifade eder. Bu şey bazen fiziksel bir engel, bazen savunulması gereken bir iddia, bazen de cevaplanmak veya çözülmek üzere ortaya konulmuş bir soru olabilir. Bu kök bize önemli bir ipucu verir. Problem kelimesinin özünde mutlaka “kötü bir şey” bulunmaz. Daha temel bir düşünce vardır: önümüze bir şey konulmuştur. Bu, yolumuzu kapatan bir kaya olabileceği gibi zihnimizin önüne bırakılmış bir matematik sorusu da olabilir. Bir bilim insanının teorisine uymayan deney sonucu da fiziksel olarak yolunu kesmez; ancak düşünsel olarak onun önüne bir şey koyar ve “Bunu nasıl açıklayacağız?” sorusunu doğurur. Bu nedenle problem kelimesini yalnızca “engel” olarak anlamak eksik kalır. Problem bazen aşılması gereken bir engel, bazen açıklanması gereken bir belirsizlik, bazen değiştirilmesi gereken bir durum, bazen de yalnızca anlaşılması gereken bir sorudur. Problem çözmenin tarihi de bir bakıma bu iki hareket arasında gidip gelir: önümüzdeki şeyi aşmak ve önümüze konulan şeyi anlamak. ### Bir Taş Ne Zaman Problem Olur? Dağın yamacından büyük bir kayanın kopup bir yolun ortasına düştüğünü düşünelim. Yol vardır, kaya vardır ve fiziksel olarak geçiş kapanmıştır. Fakat bu yolu kullanan hiçbir canlı yoksa burada bir problem olduğunu söyleyebilir miyiz? Taşın kendisi yalnızca dünyada gerçekleşmiş bir olaydır. Şimdi aynı yoldan yavrularına yiyecek götüren bir hayvanın geldiğini düşünelim. Hayvanın ulaşmak istediği bir yer vardır ve yoluna düşen taş bu hareketi engellemektedir. Taş değişmemiştir, yol değişmemiştir; ancak olayın içine bir amaç girmiştir. Artık mevcut durum ile ulaşılmak istenen durum arasında bir fark oluşmuştur. Hayvanın “Bir problemim var” diye düşünmesine veya problem kelimesini bilmesine gerek yoktur. Yavrularına ulaşmak istemektedir ve çevredeki bir koşul bunu engellemektedir. Bu örnek, problemin yalnızca insan dilinin ürettiği bir kavram olmadığını düşünmemizi sağlar. Bir canlı bir hedefe yöneliyor ve çevresindeki bir durum bu hedefe ulaşmasını engelliyorsa, en azından işlevsel anlamda problem diyebileceğimiz bir durum ortaya çıkmıştır. Buradan önemli bir sonuca ulaşabiliriz: Bir durum, kendi başına problem olmak zorunda değildir. Problem çoğu zaman o durum ile bir öznenin amacı arasındaki ilişkide doğar. ### Problem Dünyada mı, Zihnimizde mi? Bu noktada daha zor bir soruyla karşılaşırız: Problem dış dünyada mı vardır, yoksa problemi zihnimiz mi yaratır? Problemi tamamen dış dünyanın özelliği olarak kabul edersek bir şey eksik kalır. Çünkü aynı durum bir kişi için çok önemli bir problemken başka biri için tamamen önemsiz olabilir. Arabamızın motorunun çalışmaması fiziksel bir gerçektir. Ancak arabaya ihtiyacımız yoksa bu durum o anda hayatımızda önemli bir problem oluşturmayabilir. Buna karşılık ertesi sabah çok önemli bir yere yetişmek zorundaysak aynı arıza bir anda büyük bir problem hâline gelir. Ancak bunun tersini söylemek, yani problemin tamamen zihnimizin ürünü olduğunu düşünmek de yeterli değildir. Arabanın motoru gerçekten çalışmıyorsa, bu yalnızca bizim yorumumuz değildir. Dünyada fiziksel bir durum vardır. Dolayısıyla problem ne tamamen dışarıdadır ne de tamamen zihnimizin içindedir. Problem çoğu zaman özne ile dünya arasındaki ilişkide ortaya çıkar. Bir tarafta mevcut durum vardır; diğer tarafta ulaşmak, sürdürmek, anlamak veya gerçekleştirmek istediğimiz başka bir durum. Bu ikisi arasında bizim için anlamlı olan bir fark oluştuğunda problemden söz etmeye başlarız. Bu fark bazen fiziksel bir engeldir, bazen bilgi eksikliği, bazen belirsizlik, bazen de beklentilerimiz ile gerçeklik arasındaki uyuşmazlıktır. Bu nedenle problemi şöyle tarif edebiliriz: Problem, bir öznenin ulaşmak, sürdürmek, anlamak ya da gerçekleştirmek istediği bir durumun önüne çıkan; mevcut durum ile arzu edilen durum arasında anlamlı bir fark yaratan ve aşılmayı, açıklanmayı, değiştirilmesini veya yönetilmeyi gerektiren durumdur. ### Bütün Problemler Aynı Değildir Bir fabrikanın zamanında teslimat hedefinin yüzde 90 olduğunu düşünelim. Gerçekleşen oran yüzde 80’e düşmüşse elimizde oldukça açık bir fark vardır. Hedef bellidir, gerçekleşen sonuç bellidir ve ikisi arasındaki fark hesaplanabilir. Bu tür problemlerde dış dünyaya ilişkin ölçülebilir veriler oldukça güçlüdür. Şimdi başka bir cümleyi ele alalım: “Eşim beni dinlemiyor.” Burada problem çok daha farklı bir yapıdadır. Dinlememek tam olarak ne anlama gelmektedir? Konuşurken telefona bakmak mı, söylenenleri daha sonra hatırlamamak mı, yeterince soru sormamak mı, karşı tarafın fikrine katılmamak mı? Belki gerçekten ilgisiz bir davranış vardır; belki de iki insanın “dinlenmek” kavramına yüklediği anlam birbirinden farklıdır. Bu durumda olayın kendisiyle, kişinin beklentileri, geçmiş deneyimleri, kullandığı dil ve karşı tarafın niyeti birbirine karışmaya başlar. Fabrikadaki yüzde 80 teslimat oranıyla “Eşim beni dinlemiyor” cümlesi bu nedenle aynı yapıda problemler değildir. Birincisinde ölçülebilir gerçeklik daha baskınken ikincisinde anlamlandırmanın payı çok daha yüksektir. Problemleri bu nedenle bir spektrum üzerinde düşünmek yararlı olabilir. Spektrumun bir ucunda borunun çatlaması, motorun dönmemesi, ürün ölçüsünün tolerans dışında kalması gibi daha fiziksel ve ölçülebilir durumlar bulunur. Diğer uca ilerledikçe beklentiler, değerler, geçmiş deneyimler, niyetler, dil ve yorumlar daha fazla devreye girer. Bu, ikinci gruptaki problemlerin gerçek olmadığı anlamına gelmez. İnsanlar açısından son derece gerçek olabilirler. Sadece problemin tam olarak nerede bulunduğunu belirlemek daha zordur. ### Gördüğümüz Problem, Gerçek Problem Olmayabilir Bir doktorun karşısına 39 derece ateşle gelen hastayı düşünelim. Ateş gerçektir. Termometrede görülebilir ve ölçülebilir. Fakat doktor açısından problem her zaman “ateşi düşürmek” değildir. Çünkü ateş, vücudun içinde gerçekleşen başka bir sürecin belirtisi olabilir. Doktorun asıl görevi yalnızca görünen sonucu ortadan kaldırmak değil, bu sonucu hangi sürecin ürettiğini anlamaktır. Bu nedenle doktorun sorusu zaman içinde değişebilir. Başlangıçta “Ateşi nasıl düşürebilirim?” diye düşünüyor olabilir. Fakat inceleme ilerledikçe asıl soru “Bu ateşi hangi süreç üretiyor?” hâline gelir. Enfeksiyon ihtimali, başka belirtiler, test sonuçları ve hastanın geçmişi incelendikçe problem hakkındaki anlayış da değişir. Aynı durum iş hayatında da görülür. “Teslimatlar gecikiyor”, “verimlilik düşük”, “müşteri şikâyetleri arttı” veya “hatalar yükseldi” gibi ifadeler çoğu zaman problemin kendisiymiş gibi kabul edilir. Oysa bunlar bazen yalnızca problemin görünür hâle geldiği noktadır. Teslimat gecikmesinin altında kapasite sorunu bulunabilir, planlama hatası olabilir, malzeme geç geliyor olabilir veya ürünler kalite kontrolünde bekliyor olabilir. Hatta bazı durumlarda şirketin gecikme olarak gördüğü şey, başlangıçta gerçekçi olmayan bir termin tarihinin sonucudur. Bu yüzden ilk gördüğümüz durum çoğu zaman araştırmanın sonu değil, başlangıcıdır. ### Problem Tanımı Neden Değişir? Problem çözmeyi genellikle doğrusal bir süreç gibi hayal ederiz. Önce problemi tanımlar, sonra nedenlerini araştırır, çözüm geliştirir ve uygularız. Fakat gerçek hayatta süreç bundan daha hareketlidir. Bir şeylerin ters gittiğini fark eder, ilk açıklamamızı yapar, gözlem yapar ve yeni bilgiler toplarız. Bu bilgiler başlangıçtaki problem tanımımızı değiştirebilir. Yeni bir hipotez kurar, test eder ve bazen problem dediğimiz şeyin yeniden değiştiğini görürüz. Örneğin bir makinenin durduğunu gördüğümüzde ilk düşüncemiz “Makine bozuldu” olabilir. İnceleme sonucunda makinenin aslında sağlam olduğunu fark ederiz ve problemin elektrikle ilgili olduğunu düşünürüz. Elektriğin de geldiğini gördüğümüzde araştırmaya devam eder, sonunda bir güvenlik sensörünün sistemi durdurduğunu keşfedebiliriz. Dünya bu süreç boyunca değişmemiştir. Değişen, bizim dünyada olup bitenleri anlama biçimimizdir. Problem çözmenin önemli bir kısmı bu nedenle yalnızca çözüm bulmak değil, problemin ne olduğunu keşfetmektir. Hatta bazen araştırmanın sonunda daha şaşırtıcı bir sonuca ulaşırız: Başlangıçta problem olarak gördüğümüz şeyin aslında problem olmadığını fark ederiz. Kaynak metindeki ifade de tam olarak bu noktaya işaret eder: problem tanımı sabit değildir; bilgi arttıkça değişebilir. ### Problem ile Problem Tanımını Ayırmak Burada önemli bir ayrım yapmak gerekir. Problem ile problem tanımı aynı şey değildir. Dış dünyada gerçekleşen bir durum vardır. Fakat o durumun hangi bölümünü önemli gördüğümüz, ona hangi adı verdiğimiz ve olayın neden gerçekleştiğine ilişkin nasıl bir hikâye kurduğumuz bizim zihinsel modelimizin ürünüdür. Dolayısıyla problem çözmeye başladığımızda çoğu zaman doğrudan problemin kendisini değil, problem hakkındaki ilk yorumumuzu ele alırız. “Çocuk matematikte başarısız” cümlesini düşünelim. İlk bakışta açık bir problem tanımı gibi görünür. Ancak bu cümlenin altında çok farklı gerçeklikler olabilir. Çocuk bazı temel konuları öğrenmemiş olabilir, soruyu anlamıyor olabilir, kaygı yaşıyor olabilir, dikkatini toplamakta zorlanıyor olabilir, seviyesinin çok üzerinde sorularla karşılaşıyor olabilir veya yalnızca o gün uykusuz olabilir. “Matematikte başarısız” dediğimiz anda bütün bu ihtimalleri tek bir başlık altında toplamış oluruz ve zihnimiz henüz yeterli bilgi toplamadan açıklama üretmeye başlar. Bu yüzden iyi bir problem tanımı, başlangıçta verdiğimiz isimden daha fazlasıdır. Problem çözmenin kendisi çoğu zaman o ismin altında gerçekte ne bulunduğunu araştırma sürecidir. ### Bir Problem İçin Ne Gereklidir? Buraya kadar anlattıklarımızdan problemin birkaç temel unsurunu çıkarabiliriz. Öncelikle bir mevcut durum vardır; dünyada bir şey gerçekleşmektedir. Bunun yanında beklediğimiz, istediğimiz veya olması gerektiğini düşündüğümüz başka bir durum bulunur. Problem çoğu zaman bu ikisi arasındaki farkta doğar. Ancak her fark problem değildir. Bugün hava 26 derece, dün 25 derece olabilir. İki durum arasında bir fark vardır, fakat bu fark bizim için önemli değilse onu problem olarak görmeyiz. Dolayısıyla farkın yanında önem de gerekir. Ayrıca farkın bir şekilde fark edilmesi gerekir. Bir fabrikanın yıllardır büyük miktarda enerji kaybettiğini düşünelim. Fiziksel kayıp gerçekten vardır, ancak hiç kimse bunu ölçmiyor ve fark etmiyorsa organizasyon açısından henüz tanımlanmış bir problem hâline gelmemiş olabilir. Tam da bu noktada bilgi önem kazanır. Ne bildiğimiz, neyi ölçebildiğimiz ve hangi kavramlara sahip olduğumuz, hangi problemleri görebildiğimizi de belirler. Bilgi bu nedenle yalnızca mevcut problemleri çözmemizi sağlamaz; bazen daha önce problem olduğunu bile fark etmediğimiz durumları görünür hâle getirir. ### Problem Aynı Zamanda Bir Bilgi Boşluğudur Arabanın çalışmadığını biliyoruz fakat neden çalışmadığını bilmiyoruz. Teslimat oranının yüzde 80’e düştüğünü biliyoruz ama hangi sürecin bu sonucu ürettiğini bilmiyoruz. Hastanın ateşi olduğunu biliyoruz fakat ateşin nedenini henüz bilmiyoruz. Bilim insanı deney sonucunun teorisiyle uyuşmadığını görüyor ancak uyuşmazlığın deneyden mi, ölçümden mi yoksa teoriden mi kaynaklandığını bilmiyor. Bu örneklerin hepsinde mevcut durum ile hedef arasındaki farkın yanında başka bir boşluk daha vardır: bildiklerimiz ile bilmemiz gerekenler arasındaki fark. Araştırma tam olarak bu boşlukta başlar. Her yeni gözlem, ölçüm ve deney bilgi boşluğunu biraz daha küçültür. Fakat yeni bilgi her zaman problemi basitleştirmez. Bazen tam tersine, ilk açıklamamızın yanlış olduğunu göstererek problemi daha karmaşık hâle getirir. Bu bir başarısızlık değildir. Yanlış tanımlanmış basit bir problemi çözmektense doğru tanımlanmış karmaşık bir problemle karşılaşmak çok daha değerlidir. Bilimsel araştırmada da aynı yapı vardır. Bir deney sonucu teoriyle uyuşmadığında bilim insanı hemen tek bir açıklamaya sarılmaz. Deney yanlış yapılmış olabilir, ölçüm cihazı sorunlu olabilir, veriler yanlış yorumlanmış olabilir veya teorinin varsayımlarından biri hatalı olabilir. Yeni deneyler ve kontroller yapıldıkça yalnızca cevaba yaklaşılmaz; problemin kendisinin ne olduğuna ilişkin anlayış da değişir. Bilimsel ilerlemenin önemli bir kısmı bu nedenle yalnızca yeni cevaplar üretmek değil, daha iyi sorular sormayı öğrenmektir. ### Çözüm Aramadan Önce İnsan zihni çözüme hızlı ulaşmayı sever. Bir şey ters gittiğinde neredeyse otomatik olarak ne yapılması gerektiğini düşünmeye başlarız. Makine durduğunda bakım çağırmak, teslimatlar geciktiğinde üretimi hızlandırmak, çocuk ders çalışmadığında daha fazla baskı yapmak veya bir ilişkide sorun çıktığında karşı tarafı değiştirmeye çalışmak bize doğal gelir. Bunların bazıları gerçekten işe yarayabilir. Ancak henüz problemi anlamadan seçilmiş bir çözüm, özünde bir tahmindir. Hatta bazen son derece iyi uygulanan bir çözüm, yanlış tanımlanmış bir probleme yöneltilmiş olabilir. Yanlış probleme verilen mükemmel bir çözüm ise bizi istediğimiz sonuca ulaştırmayacaktır. Bu nedenle iyi problem çözücüleri diğerlerinden ayıran şey yalnızca Balık Kılçığı, 5 Neden, DMAIC veya istatistik gibi daha fazla yöntem bilmeleri değildir. Bunlardan önce gelen daha temel bir zihinsel alışkanlık vardır: Bir şey ters göründüğünde hemen karar vermemek, ilk açıklamaya fazla bağlanmamak, belirti ile nedeni birbirinden ayırabilmek ve yeni bilgi geldikçe problem tanımını değiştirebilmek. Kaynak metnin sonunda vurgulanan soru bu yaklaşımı çok iyi özetler: “Burada gerçekten problem olan şey ne?” Belki de iyi problem çözücülerin en önemli özelliği, her zaman diğer insanlardan daha çok cevap bilmeleri değildir. Çoğu zaman onları farklılaştıran şey, cevaba koşmadan önce sorunun ne olduğunu biraz daha uzun süre araştırabilmeleridir. Çünkü bazen çözümün en zor kısmı çözümü bulmak değildir. Çözülmesi gereken doğru problemi bulmaktır."
