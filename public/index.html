<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inkGuide — Kitabınızın Yol Arkadaşı</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2355663F' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3.2c3.6 4.1 5.6 6.8 5.6 9.4a5.6 5.6 0 1 1-11.2 0c0-2.6 2-5.3 5.6-9.4Z'/%3E%3Cpath d='M14.2 10.6 12.7 14.2 9.1 15.7l1.5-3.6Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="/vendor/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- SOL: Bölüm ağacı -->
    <aside class="sidebar">
      <div class="brand" data-i18n-title="brand.tip" title="inkGuide — Kitabınız bilgisayarınızdan çıkmaz">
        <svg viewBox="0 0 24 24"><path d="M12 3.2c3.6 4.1 5.6 6.8 5.6 9.4a5.6 5.6 0 1 1-11.2 0c0-2.6 2-5.3 5.6-9.4Z"/><path d="M14.2 10.6 12.7 14.2 9.1 15.7l1.5-3.6Z"/></svg>
        <span class="wordmark">ink<b>Guide</b></span>
      </div>
      <a class="library-link" id="libraryLink" href="#" data-i18n-title="nav.libraryTip" title="Kitaplığım — tüm kitap projeleriniz">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> <span data-i18n="nav.library">Kitaplığım</span>
      </a>
      <div class="book-head">
        <div class="book-title" id="bookTitle"></div>
        <div class="book-subtitle" id="bookSubtitle"></div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText"></div>
        </div>
      </div>

      <nav class="tree" id="tree"></nav>

      <div class="export-result" id="exportResult" hidden></div>
    </aside>

    <!-- ORTA: Editör -->
    <main class="editor" id="editor"></main>

    <!-- SAĞ: Yol Arkadaşı -->
    <aside class="companion">
      <h3>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88"/></svg>
        <span data-i18n="comp.title">Yol Arkadaşı</span>
      </h3>
      <div class="tip-card">
        <div class="tip-label">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.8 5.8 1.9-5.8 1.9L12 18.4l-1.9-5.8-5.8-1.9 5.8-1.9Z"/></svg>
          <span data-i18n="comp.tipLabel">Günün İpucu</span>
        </div>
        <div class="tip-text" id="tipText"></div>
        <button class="tip-next" id="tipNext" data-i18n="comp.tipNext">Başka ipucu →</button>
      </div>
      <div class="tray" id="scratchTray"></div>
      <div class="lang-row" data-i18n-title="comp.dicteTip" title="Sesli not (dikte) hangi dilde konuşmanızı bekleyecek?">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg>
        <span data-i18n="comp.dicteLang">Dikte dili</span>
        <select id="dicteLangSel"></select>
      </div>
      <div class="stats" id="stats"></div>
      <div class="save-indicator" id="saveIndicator"></div>
    </aside>

    <!-- EN SAĞ: araç rayı — sol panel yalnızca kitaba kalsın diye -->
    <aside class="rail" aria-label="Araçlar">
      <button id="guideRail" class="ric" data-i18n-title="tree.guide" title="İlk Kitap Rehberi">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 13.8 13.8 8.5 15.5 10.2 10.2"/></svg>
      </button>
      <button id="frontRail" class="ric" data-i18n-title="tree.front" title="Ön Sayfalar">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
      </button>
      <button id="sourcesRail" class="ric" data-i18n-title="tree.sources" title="Kaynaklar">
        <svg viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      </button>
      <button id="scratchRail" class="ric" data-i18n-title="tree.scratch" title="Karalama Defteri">
        <svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      </button>
      <div class="rail-sep"></div>
      <button id="phoneBtn" class="ric" data-i18n-title="phone.btnTip" title="Telefonunuzu eşleştirin">
        <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 19h2"/></svg>
      </button>
      <button id="versionBtn" class="ric" data-i18n-title="btn.versionTip" title="Versiyonlar">
        <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      </button>
      <button id="settingsRail" class="ric" data-i18n-title="tree.settings" title="Ayarlar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 12a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2-1.2L14.5 3h-5l-.4 2.6a7.4 7.4 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2 1.2l.4 2.6h5l.4-2.6a7.4 7.4 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>
      </button>
      <div class="rail-grow"></div>
      <button id="exportBtn" class="ric rail-cta" data-i18n-title="btn.exportTip" title="Kitaba Dönüştür">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </button>
    </aside>
  </div>

  <!-- Versiyonlar penceresi buraya çizilir -->
  <div id="versionHost"></div>

  <!-- Kitaplığım: tam ekran çoklu kitap görünümü -->
  <div id="libraryView" hidden></div>

  <!-- Kurulum sihirbazı (ilk açılış) buraya çizilir -->
  <div id="onboardHost"></div>

  <!-- Telefon eşleştirme modalı buraya çizilir -->
  <div id="phoneHost"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
