<!DOCTYPE html>
<html lang="{{lang}}"{{dir_attr}}>
<head>
{{head}}
{{meta}}
<style>
  /* --- Rehber sayfası ---
     Gövde public/guide/<dil>.json'dan gelir (uygulamanın rehberiyle tek kaynak),
     bu yüzden sınıf adları uygulamadakiyle aynıdır; biçimler site token'larına çekildi. --- */
  .guide-wrap { max-width: 760px; padding-top: 72px; padding-bottom: 84px; }

  /* Not: uygulamadaki .guide-kicker üst etiketi web sürümünde kaldırılır
     (build-site.mjs → guideBody), başlıkla aynı cümleyi tekrar etmesin diye. */
  .guide h1 {
    font-family: var(--serif); font-size: clamp(34px, 5vw, 48px); font-weight: 600;
    letter-spacing: -.025em; line-height: 1.1; margin: 16px 0 0;
  }
  .guide .guide-lead { font-size: 17px; line-height: 1.8; color: var(--ink-soft); margin: 20px 0 0; }
  .guide h2 {
    font-family: var(--serif); margin: 52px 0 16px; font-size: 26px;
    font-weight: 600; letter-spacing: -.01em;
  }
  .guide p, .guide li { font-size: 15.5px; line-height: 1.75; color: var(--ink-soft); margin-bottom: 6px; }
  .guide ul { padding-inline-start: 22px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .guide ul li { margin-bottom: 0; }
  .guide b { color: var(--ink); font-weight: 600; }
  .guide code {
    font-size: 13.5px; background: var(--paper-panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 7px;
  }

  .guide .guide-steps { display: flex; flex-direction: column; gap: 16px; }
  .guide .guide-step { display: flex; gap: 18px; }
  .guide .guide-num {
    font-family: var(--serif); font-size: 23px; color: var(--accent);
    min-width: 30px; flex-shrink: 0; line-height: 1.5;
  }
  .guide .guide-step p { margin: 0; }

  .guide .guide-tipbox {
    border: 1px solid var(--honey-line); border-radius: var(--radius); background: var(--honey-bg);
    padding: 17px 20px; margin-top: 18px; font-size: 15px; line-height: 1.75; color: var(--ink-soft);
  }

  .guide .kural {
    background: var(--white); border: 1px solid var(--line);
    border-inline-start: 3px solid var(--accent); border-radius: 10px;
    padding: 14px 17px; margin: 10px 0 0; font-size: 15px; line-height: 1.7; color: var(--ink-soft);
  }

  .guide .guide-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
  .guide .guide-card {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--white); padding: 17px 19px;
  }
  .guide .guide-card .t { font-size: 15px; font-weight: 600; color: var(--ink); }
  .guide .guide-card .d { font-size: 14px; line-height: 1.65; color: var(--ink-muted); margin-top: 6px; }

  @media (max-width: 900px) { .guide .guide-cards { grid-template-columns: 1fr; } }

  /* Sayfa sonu: rehberden indirmeye köprü */
  .guide-close {
    margin-top: 56px; padding-top: 34px; border-top: 1px solid var(--line);
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .guide-close p { margin: 0; flex: 1; min-width: 240px; font-size: 15.5px; color: var(--ink-muted); }
</style>
</head>
<body>
<a class="skip-link" href="#content">{{skip_link}}</a>

{{header}}

<main id="content">

  <article class="wrap guide-wrap guide">
{{guide_body}}

    <div class="guide-close">
      <p>{{guide_close_lead}}</p>
      <a class="btn btn-primary" href="download.html">{{header_cta}}</a>
    </div>
  </article>

</main>

{{footer}}

</body>
</html>
